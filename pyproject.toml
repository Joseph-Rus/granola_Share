[project]
name = "granola-share"
version = "0.2.0"
description = "Pool your friends' Granola lecture notes on your own server, sorted by class."
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.20,<2",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "markdown>=3.5",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
granola-share = "granola_share.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["granola_share*"]
