[project]
name = "granola-share"
dynamic = ["version"]
description = "Pool your friends' Granola lecture notes on your own server, sorted by class."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.20,<2",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "markdown>=3.5",
    "python-multipart>=0.0.9",
    # macOS only: read Granola's window to copy transcripts (transcript_grab.py)
    "pyobjc-framework-ApplicationServices>=10.3; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
granola-share = "granola_share.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
# The one place the version lives. Bump it on main and CI publishes a release.
version = { attr = "granola_share.__version__" }

[tool.setuptools.packages.find]
include = ["granola_share*"]
