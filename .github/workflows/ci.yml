# The update pipeline.
#   Every push and pull request: tests on macOS, Linux, and Windows, then the real one-line
#   installer on each, then a server that boots and answers.
#   Push to main with a new version in granola_share/__init__.py: once all of that passes,
#   publish release v<version>, with four installers for people who download them (a laptop and a
#   library one each for Mac and Windows), and the zips the installer and auto-update use.
#   Installed copies pick it up within a few hours (auto_update), or right away with
#   `granola-share update`.
#   The C# engine and the new app built on it ride along: every push builds and checks them (engine zips for
#   each computer, the Mac and Windows apps), and a release carries them too: the engine zips are what a C#
#   install updates from, and the apps are a preview until they replace the Python-engine ones (stage 7).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12"]
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: windows-latest  # the Python the Windows download (windows/bundle.ps1) ships
            python: "3.13"
    timeout-minutes: 15
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Run tests
        run: uv run --python ${{ matrix.python }} --extra dev pytest -q

  # The C# engine that is replacing the Python one (engine/). It must read and write every file exactly as the
  # Python engine does, so both run here: golden files from Python, and a library passed from one to the other.
  # Not part of the release yet: Python keeps shipping until the C# engine takes over.
  engine:
    name: C# engine (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    timeout-minutes: 15
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      STUDYSTASH_REQUIRE_PYTHON: "1"  # the cross-engine test may not skip itself here
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: The Python engine, in .venv, for the cross-engine test
        run: uv sync --python 3.12
      - name: Golden files and page text still match the Python engine
        if: runner.os == 'Linux'
        run: |
          uv run python engine/tests/golden.py
          git diff --exit-code -- engine/tests/StudyStash.Core.Tests/Golden engine/src/StudyStash.Library/PageText.cs
      # Whisper's smallest model, so the live tests hear real speech on each system (the app uses large-v3).
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/whisper
          key: whisper-ggml-tiny-v1
      - name: Whisper tiny, for the live transcription tests
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/whisper"
          [ -f "$RUNNER_TEMP/whisper/ggml-tiny.bin" ] || curl -fsSL -o "$RUNNER_TEMP/whisper/ggml-tiny.bin" \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.bin
          echo "STUDYSTASH_WHISPER_MODEL=$RUNNER_TEMP/whisper/ggml-tiny.bin" >> "$GITHUB_ENV"
      - name: Run tests
        run: dotnet test engine/StudyStash.slnx
        env:
          # Windows: also run the library as a real background service, from the Startup folder with no window.
          STUDYSTASH_LIVE_SERVICE: ${{ runner.os == 'Windows' && '1' || '' }}

  install:
    name: installer (${{ matrix.os }})
    needs: [test, windows-helper]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    timeout-minutes: 20  # a hang fails fast instead of holding everything up for hours
    runs-on: ${{ matrix.os }}
    env:
      GRANOLA_SHARE_SRC: ${{ github.workspace }}
      GRANOLA_SHARE_NO_SETUP: "1"
    steps:
      - uses: actions/checkout@v4
      # No setup-uv here on purpose: the installer has to fetch uv itself, as on a fresh laptop.
      - name: Install (macOS / Linux)
        if: runner.os != 'Windows'
        run: |
          sh install.sh client
          sh install.sh server   # a second run must update in place
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: windows-helper
          path: ${{ runner.temp }}/helper
      - name: Install (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        env:
          GRANOLA_SHARE_BUNDLE: ${{ runner.temp }}\helper\Study-Stash-helper-windows.zip  # this commit's, not a release's
        run: |
          .\install.ps1
          .\install.ps1   # a second run swaps in a fresh copy of the folder
          Add-Content $env:GITHUB_PATH "$env:USERPROFILE\.local\bin"
          & "$env:USERPROFILE\.local\bin\granola-share.cmd" --version
      - name: Set up a pool without a keyboard and boot it
        shell: bash
        run: |
          H="$RUNNER_TEMP/gs"
          granola-share --version
          granola-share --home "$H" setup --yes --pool-name CI --password pw --pool-dir "$RUNNER_TEMP/pool" \
            --port 8799 --class "CS 101=cs101" --no-server-sync --no-autostart --no-pull < /dev/null
          granola-share --home "$H" serve > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS -H "Authorization: Bearer pw" http://127.0.0.1:8799/api/health && break
            sleep 2
          done
          curl -fsS -X POST -H "Authorization: Bearer pw" -H "Content-Type: application/json" \
            -d '{"id":"ci-1","title":"CS101 lecture 1","notes_markdown":"loops"}' http://127.0.0.1:8799/api/ingest
          # the note is filed in the background; wait for it (no /dev/stderr on Windows)
          for i in $(seq 1 30); do
            S=$(curl -fsS http://127.0.0.1:8799/api/status); echo "$S"
            case "$S" in *'"done":1'*) break;; esac
            sleep 2
          done
          echo "$S" | grep -q '"done":1'
          curl -fsS http://127.0.0.1:8799/ | grep -q "CS101 lecture 1"
          granola-share --home "$H" doctor --role server || true
          # the laptop's Study Stash page comes up before any setup
          granola-share --home "$RUNNER_TEMP/laptop" client run > "$RUNNER_TEMP/client.log" 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/healthz && break; sleep 2; done
          curl -fsS http://127.0.0.1:8765/healthz | grep -q granola-share
      - name: "Windows: the library runs in the background, keeps its log, and the app gets its icon"
        if: runner.os == 'Windows'
        shell: bash
        run: |
          H="$RUNNER_TEMP/gs2"
          granola-share --home "$H" setup --yes --pool-name CI2 --password pw --pool-dir "$RUNNER_TEMP/pool2" \
            --port 8798 --no-autostart --no-pull < /dev/null
          granola-share --home "$H" autostart install --role server
          for i in $(seq 1 30); do curl -fsS -H "Authorization: Bearer pw" http://127.0.0.1:8798/api/health && break; sleep 2; done
          curl -fsS -o /dev/null http://127.0.0.1:8798/favicon.ico
          test "$(granola-share --home "$H" autostart status --role server)" = running
          grep -q "pool 'CI2' on port 8798" "$H/logs/server.log"   # pythonw has no console: keep_alive writes it
          granola-share --home "$H" doctor --role server || true
          granola-share --home "$H" autostart uninstall --role server
          granola-share --home "$RUNNER_TEMP/laptop2" client open --install --no-browser
          # the Start Menu entry opens the Windows app (fetched from the newest release), or the page with our icon
          powershell -NoProfile -Command '$s = (New-Object -ComObject WScript.Shell).CreateShortcut((Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\Study Stash.lnk")); Write-Host "$($s.TargetPath) | $($s.IconLocation)"; if (-not ($s.TargetPath -like "*\Study Stash.exe" -or $s.IconLocation -like "*study-stash.ico*")) { exit 1 }'
      - name: Server log
        if: failure()
        shell: bash
        run: cat "$RUNNER_TEMP/server.log" "$RUNNER_TEMP/client.log" "$RUNNER_TEMP/gs2/logs/server.log" || true

  windows-helper:
    name: Windows download (granola-share with its own Python)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"  # builds the packages for the embeddable Python 3.13 it ships
      - name: Build Study-Stash-helper-windows.zip
        shell: pwsh
        run: ./windows/bundle.ps1 -Out dist
      - name: It runs by itself, with every package it needs
        shell: pwsh
        run: |
          $t = Join-Path $env:RUNNER_TEMP "unpacked"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::ExtractToDirectory((Resolve-Path dist\Study-Stash-helper-windows.zip), $t)
          $py = Join-Path $t "python\python.exe"
          & $py -m granola_share.cli --version
          & $py -c "import granola_share.cli, granola_share.web, granola_share.granola, granola_share.client_app, mcp.client.streamable_http, uvicorn, win32api; print('imports ok')"
          if ($LASTEXITCODE -ne 0) { throw "it doesn't run on its own" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-helper
          path: dist/Study-Stash-helper-windows.zip

  mac-app:
    name: Mac apps (DMGs)
    timeout-minutes: 20
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Study Stash.app and Study Stash Library.app, their zips, and the DMGs
        run: sh macos/build.sh "" dist
      - name: Both apps start
        run: |
          for app in "Study Stash" "Study Stash Library"; do
            file "dist/$app.app/Contents/MacOS/Study Stash" | grep -q "universal binary"
            codesign --verify --deep "dist/$app.app"
            GRANOLA_SHARE_HOME="$RUNNER_TEMP/none" "dist/$app.app/Contents/MacOS/Study Stash" &
            sleep 8
            kill -0 $!   # still running after 8 seconds: it launched and showed its window
            kill $!
          done
          /usr/libexec/PlistBuddy -c "Print :StudyStashRole" "dist/Study Stash Library.app/Contents/Info.plist" | grep -qx library
      - uses: actions/upload-artifact@v4
        with:
          name: mac-app
          path: |
            dist/Study-Stash-Laptop.dmg
            dist/Study-Stash-Library.dmg
            dist/Study-Stash-mac.zip
            dist/Study-Stash-Library-mac.zip

  windows-app:
    name: Windows apps (Setup.exe)
    timeout-minutes: 20
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tools (Inno Setup, and WebView2 if this image lacks it)
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          $wv = "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}"
          if (-not (Test-Path $wv)) {
            Invoke-WebRequest "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile "$env:RUNNER_TEMP\wv2.exe"
            Start-Process "$env:RUNNER_TEMP\wv2.exe" -ArgumentList "/silent", "/install" -Wait
          }
      - name: Build Study Stash.exe, its zip, and both Setup.exe installers
        shell: pwsh
        run: ./windows/build.ps1 -Out dist
      - name: The app starts and shows its first screen, as the laptop's and as the library's
        shell: pwsh
        run: |
          $env:GRANOLA_SHARE_HOME = "$env:RUNNER_TEMP\none"
          $env:GRANOLA_SHARE_ENGINE = "$env:RUNNER_TEMP\none\granola-share.exe"  # not installed: the welcome screen
          foreach ($mode in @(@(), @("--library"))) {
            $env:GRANOLA_SHARE_SELFTEST = "$env:RUNNER_TEMP\selftest$($mode.Count).txt"
            $p = if ($mode.Count) { Start-Process -FilePath "dist\Study Stash\Study Stash.exe" -ArgumentList $mode -PassThru }
                 else { Start-Process -FilePath "dist\Study Stash\Study Stash.exe" -PassThru }
            for ($i = 0; $i -lt 60 -and -not (Test-Path $env:GRANOLA_SHARE_SELFTEST); $i++) { Start-Sleep 1 }
            if (-not (Test-Path $env:GRANOLA_SHARE_SELFTEST)) { Stop-Process -Id $p.Id -ErrorAction SilentlyContinue; throw "no first screen in 60 s ($mode)" }
            $said = Get-Content $env:GRANOLA_SHARE_SELFTEST
            Write-Host "$mode $said"
            if ($said -notlike "ok*") { throw $said }
          }
      - name: Each Setup.exe installs its app for this account, with a Start Menu entry
        shell: pwsh
        run: |
          foreach ($pair in @(@("Laptop", "Study Stash"), @("Library", "Study Stash Library"))) {
            $setup, $name = $pair
            Start-Process "dist\Study-Stash-$setup-Setup.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
            if (-not (Test-Path "$env:LOCALAPPDATA\Programs\$name\Study Stash.exe")) { throw "$name isn't installed" }
            if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\$name.lnk")) { throw "no Start Menu entry for $name" }
          }
          if (-not (Select-String -Path "$env:LOCALAPPDATA\Programs\Study Stash Library\study-stash.ini" -Pattern "role=library" -Quiet)) { throw "the library's copy isn't marked" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: |
            dist/Study-Stash-windows.zip
            dist/Study-Stash-Laptop-Setup.exe
            dist/Study-Stash-Library-Setup.exe

  # The C# engine as the folders a release carries, one per computer: what the updater downloads
  # (Study-Stash-engine-<os>-<cpu>.zip, study-stash-engine.txt beside the program). Each is built self-contained
  # and run on a computer of its kind before it's kept.
  engine-zips:
    name: engine zip (${{ matrix.asset }})
    needs: [engine]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, rid: osx-arm64, asset: mac-arm64 }
          - { os: macos-15-intel, rid: osx-x64, asset: mac-x64 }
          - { os: ubuntu-latest, rid: linux-x64, asset: linux-x64 }
          - { os: ubuntu-24.04-arm, rid: linux-arm64, asset: linux-arm64 }
          - { os: windows-latest, rid: win-x64, asset: windows-x64 }
    timeout-minutes: 20
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Publish the engine
        shell: bash
        run: |
          V=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' granola_share/__init__.py)
          OUT="$RUNNER_TEMP/engine"
          dotnet publish engine/src/StudyStash.Engine -c Release -r ${{ matrix.rid }} --self-contained true -p:DebugType=None -o "$OUT"
          printf '%s\n' "$V" > "$OUT/study-stash-engine.txt"
          echo "V=$V" >> "$GITHUB_ENV"
      - name: It runs here and says its version
        shell: bash
        run: |
          EXE="$RUNNER_TEMP/engine/studystash"; [ -f "$EXE.exe" ] && EXE="$EXE.exe"
          test "$("$EXE" version | tr -d '\r')" = "$V"
          "$EXE" --home "$RUNNER_TEMP/h" ai   # the AI settings read with no ai.json
      - name: Zip it (the program at the top, as the updater unpacks it)
        shell: bash
        run: |
          mkdir -p dist
          cd "$RUNNER_TEMP/engine" && python3 -c "import os,sys,zipfile; z=zipfile.ZipFile(sys.argv[1],'w',zipfile.ZIP_DEFLATED); [z.write(os.path.join(r,f), os.path.relpath(os.path.join(r,f))) for r,_,fs in os.walk('.') for f in fs]; z.close()" "$GITHUB_WORKSPACE/dist/Study-Stash-engine-${{ matrix.asset }}.zip" \
            || python -c "import os,sys,zipfile; z=zipfile.ZipFile(sys.argv[1],'w',zipfile.ZIP_DEFLATED); [z.write(os.path.join(r,f), os.path.relpath(os.path.join(r,f))) for r,_,fs in os.walk('.') for f in fs]; z.close()" "$GITHUB_WORKSPACE/dist/Study-Stash-engine-${{ matrix.asset }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: engine-${{ matrix.asset }}
          path: dist/Study-Stash-engine-${{ matrix.asset }}.zip

  # The new app (engine/src/StudyStash.App: the menu bar panel, recorder, quick panel, library, and the AI, Canvas,
  # chat and capture), for Apple silicon and Intel Macs. The Apple silicon one tries itself in its real windows.
  new-app-mac:
    name: new app (Mac)
    needs: [engine]
    timeout-minutes: 25
    runs-on: macos-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build Study Stash.app and its DMG, for each kind of Mac
        run: |
          sh macos/build-app.sh arm64 dist/arm64
          sh macos/build-app.sh x64 dist/x64
      - name: It opens its windows and tries each one (no library, so setup first)
        run: |
          APP="dist/arm64/Study Stash.app"
          codesign --verify --deep "$APP"
          STUDYSTASH_SELFTEST="$RUNNER_TEMP/selftest" "$APP/Contents/MacOS/StudyStash" --home "$RUNNER_TEMP/none" &
          for i in $(seq 1 90); do [ -f "$RUNNER_TEMP/selftest/selftest.txt" ] && break; sleep 1; done
          cat "$RUNNER_TEMP/selftest/selftest.txt"
          tail -1 "$RUNNER_TEMP/selftest/selftest.txt" | grep -qx ok
      - name: Name the DMGs for the release
        run: |
          mkdir -p out
          cp dist/arm64/*.dmg out/Study-Stash-App-preview-mac-arm64.dmg
          cp dist/x64/*.dmg out/Study-Stash-App-preview-mac-x64.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: new-app-mac
          path: out/*.dmg
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: new-app-mac-selftest
          path: ${{ runner.temp }}/selftest

  new-app-windows:
    name: new app (Windows)
    needs: [engine]
    timeout-minutes: 25
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Publish the app (Whisper's libraries for Windows only)
        shell: pwsh
        run: |
          $out = "dist\Study Stash"
          dotnet publish engine\src\StudyStash.App -c Release -r win-x64 --self-contained true -p:DebugType=None -o $out
          Get-ChildItem "$out\runtimes" -Directory | Where-Object { $_.Name -notin @("win-x64", "vulkan") } | Remove-Item -Recurse -Force
      - name: It opens its windows and tries each one (no library, so setup first)
        shell: pwsh
        run: |
          $env:STUDYSTASH_SELFTEST = "$env:RUNNER_TEMP\selftest"
          $p = Start-Process -FilePath "dist\Study Stash\StudyStash.exe" -ArgumentList "--home", "$env:RUNNER_TEMP\none" -PassThru
          $f = "$env:STUDYSTASH_SELFTEST\selftest.txt"
          for ($i = 0; $i -lt 90 -and -not (Test-Path $f); $i++) { Start-Sleep 1 }
          if (-not (Test-Path $f)) { Stop-Process -Id $p.Id -ErrorAction SilentlyContinue; throw "no self-test in 90 s" }
          Get-Content $f
          if ((Get-Content $f | Select-Object -Last 1) -ne "ok") { throw "the self-test failed" }
      - name: Zip it
        shell: pwsh
        run: Compress-Archive -Path "dist\Study Stash" -DestinationPath dist\Study-Stash-App-preview-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: new-app-windows
          path: dist/Study-Stash-App-preview-windows-x64.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: new-app-windows-selftest
          path: ${{ runner.temp }}/selftest

  release:
    name: publish release
    needs: [test, install, mac-app, windows-app, windows-helper, engine-zips, new-app-mac, new-app-windows]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: mac-app
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: windows-app
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: windows-helper
          path: dist
      - uses: actions/download-artifact@v4
        with:
          pattern: engine-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: new-app-mac
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: new-app-windows
          path: dist
      - name: Publish v<version> if it is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' granola_share/__init__.py)
          if [ -z "$V" ]; then echo "no __version__ found"; exit 1; fi
          if git rev-parse -q --verify "refs/tags/v$V" >/dev/null; then
            echo "v$V is already released; bump __version__ to publish a new one."
            exit 0
          fi
          gh release create "v$V" --target "$GITHUB_SHA" --title "v$V" --generate-notes \
            dist/Study-Stash-Laptop.dmg dist/Study-Stash-Library.dmg dist/Study-Stash-Laptop-Setup.exe \
            dist/Study-Stash-Library-Setup.exe dist/Study-Stash-mac.zip dist/Study-Stash-Library-mac.zip \
            dist/Study-Stash-windows.zip dist/Study-Stash-helper-windows.zip \
            dist/Study-Stash-engine-*.zip dist/Study-Stash-App-preview-*
